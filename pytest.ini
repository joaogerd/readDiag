[pytest]
addopts = -ra
testpaths = tests
filterwarnings =
    default::DeprecationWarning
markers =
    benchmark: benchmark tests (requires pytest-benchmark)
    legacy: legacy compatibility tests (run separately from fast CI)
[tool:pytest]
#addopts = -q --cov=readDiag --cov-branch --cov-report=term-missing --cov-report=html
filterwarnings =
    ignore:.*legacy package 'gsidiag'.*:DeprecationWarning
    ignore:.*Column name 'idqc' is deprecated.*:DeprecationWarning
    ignore:.*readDiag.utils is deprecated.*:DeprecationWarning
    ignore:.*legacy package 'gsidiag'.*:DeprecationWarning

